<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 672" font-family="Chiron GoRound TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <!-- 流感病毒生命週期（依講義 01. 抗病毒藥物（流感）的圖重畫，直式）
       對齊基準（畫布 472×672）：直欄 L=70（進入・內體）、C=240（脫殼・RNA 複製）、R=360（出芽・釋放）；細胞膜 y=250。
       流程編號一律 r=11，放在箭頭右邊 20px（橫箭頭放下方 20px），文字再往右 16px。
       主流程箭頭 2.5px、同一個箭頭頭部；⊖ 抑制框用 1.6px 虛線連到它擋住的那一步。 -->
  <defs>
    <g id="v">
      <g stroke="#426C50" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M0-22v-8M11-19l4-7M19-11l7-4M22 0h8M19 11l7 4M11 19l4 7M0 22v8M-11 19l-4 7M-19 11l-7 4M-22 0h-8M-19-11l-7-4M-11-19l-4-7"/>
      </g>
      <g fill="#fff" stroke="#426C50" stroke-width="1.6">
        <circle cx="0" cy="-33" r="3"/><circle cx="28" cy="-17" r="3"/><circle cx="28" cy="17" r="3"/>
        <circle cx="0" cy="33" r="3"/><circle cx="-28" cy="17" r="3"/><circle cx="-28" cy="-17" r="3"/>
      </g>
      <circle r="22" fill="#DCE8F2" stroke="#426C50" stroke-width="2"/>
      <rect x="18" y="-6" width="9" height="3" fill="#24372C"/><rect x="18" y="3" width="9" height="3" fill="#24372C"/>
      <path d="M-11-4q4-5 8 0t8 0t8 0M-11 5q4-5 8 0t8 0t8 0" fill="none" stroke="#426C50" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#315B43"/>
    </marker>
    <marker id="arH" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#D9897A"/>
    </marker>
  </defs>

  <!-- 區域：細胞外（淡藍）／細胞膜／宿主細胞內（米色） -->
  <rect width="472" height="672" fill="#F4FAFC"/>
  <path d="M0 250H318C334 250 342 232 360 232C378 232 386 250 402 250H472V672H0Z" fill="#FBF3E4"/>
  <path d="M0 250H318C334 250 342 232 360 232C378 232 386 250 402 250H472" fill="none" stroke="#B9A57E" stroke-width="3"/>
  <text x="452" y="26" font-size="12" fill="#6E7F72" text-anchor="end">細胞外</text>
  <text x="452" y="290" font-size="12" fill="#9C8762" text-anchor="end">宿主細胞內</text>

  <!-- 病毒構造（圖例） -->
  <use href="#v" x="70" y="64"/>
  <text x="70" y="114" font-size="11" fill="#426C50" text-anchor="middle">RNA virus</text>
  <path d="M100 60H110" stroke="#24372C" stroke-width="1"/>
  <text x="114" y="64" font-size="11" fill="#24372C">M2 Protein（▮▮）</text>
  <text x="114" y="82" font-size="11" fill="#24372C">表面：Hemagglutinin、</text>
  <text x="114" y="98" font-size="11" fill="#24372C">Neuraminidase</text>

  <!-- ① 進入細胞 → Endosome -->
  <path d="M70 124V290" stroke="#315B43" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="90" cy="180" r="11" fill="#315B43"/><text x="90" y="184" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <text x="106" y="184" font-size="12" fill="#315B43" font-weight="700">進入細胞</text>

  <circle cx="70" cy="340" r="44" fill="#fff" stroke="#426C50" stroke-width="2" stroke-dasharray="5 4"/>
  <use href="#v" x="70" y="340"/>
  <text x="70" y="402" font-size="11" fill="#426C50" text-anchor="middle">Endosome 形成</text>
  <path d="M156 336H104" stroke="#D9897A" stroke-width="2.5" marker-end="url(#arH)"/>
  <text x="162" y="334" font-size="13" fill="#C0624F" font-weight="700">H⁺</text>
  <text x="162" y="349" font-size="11" fill="#C0624F">pH↓</text>

  <!-- ② 脫殼 -->
  <path d="M110 368H198" stroke="#315B43" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="164" cy="388" r="11" fill="#315B43"/><text x="164" y="392" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <text x="180" y="392" font-size="12" fill="#315B43" font-weight="700">脫殼</text>
  <path d="M248 342a26 26 0 1 0 0 52" fill="none" stroke="#426C50" stroke-width="2.5"/>
  <path d="M232 362q5-6 10 0t10 0M232 376q5-6 10 0t10 0" fill="none" stroke="#426C50" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="412" font-size="11" fill="#6E7F72" text-anchor="middle">釋出 RNA</text>

  <!-- ⊖ 擋在 ② 脫殼（講義文字：Amantadine 可抑制病毒脫殼；原圖虛線接在 M2 Protein／H⁺ 處） -->
  <path d="M140 368V430" stroke="#D9897A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="20" y="430" width="140" height="70" rx="10" fill="#FDF1EE" stroke="#E7B3A6" stroke-width="1.5"/>
  <circle cx="38" cy="449" r="8" fill="#D9897A"/><path d="M33.5 449h9" stroke="#fff" stroke-width="2"/>
  <text x="52" y="453" font-size="11" fill="#C0624F" font-weight="700">治療 A 型流感</text>
  <text x="32" y="472" font-size="12" fill="#24372C" font-weight="700">Amantadine</text>
  <text x="32" y="489" font-size="12" fill="#24372C" font-weight="700">Rimantadine</text>

  <!-- ③ RNA 複製 -->
  <path d="M240 422V484" stroke="#315B43" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="260" cy="453" r="11" fill="#315B43"/><text x="260" y="457" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
  <text x="276" y="457" font-size="12" fill="#315B43" font-weight="700">RNA 複製</text>
  <ellipse cx="240" cy="524" rx="64" ry="34" fill="#fff" stroke="#426C50" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="240" y="520" font-size="12" fill="#24372C" text-anchor="middle" font-weight="700">RNA polymerase</text>
  <text x="240" y="536" font-size="10" fill="#6E7F72" text-anchor="middle">Replication of viral RNA</text>

  <!-- ⊖ 擋在 ③ RNA 複製 -->
  <path d="M240 558V586" stroke="#D9897A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="146" y="586" width="188" height="66" rx="10" fill="#FDF1EE" stroke="#E7B3A6" stroke-width="1.5"/>
  <circle cx="164" cy="605" r="8" fill="#D9897A"/><path d="M159.5 605h9" stroke="#fff" stroke-width="2"/>
  <text x="178" y="609" font-size="10.5" fill="#C0624F" font-weight="700">RNA polymerase inhibitors</text>
  <text x="158" y="634" font-size="12" fill="#24372C" font-weight="700">Ribavirin</text>

  <!-- ④ 運送・配裝 → 出芽（直角轉折） -->
  <path d="M304 524H350Q360 524 360 514V292" fill="none" stroke="#315B43" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="380" cy="420" r="11" fill="#315B43"/><text x="380" y="424" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>
  <text x="396" y="424" font-size="12" fill="#315B43" font-weight="700">運送・配裝</text>
  <text x="396" y="441" font-size="12" fill="#315B43" font-weight="700">→ 出芽</text>
  <use href="#v" x="360" y="250"/>

  <!-- ⑤ 釋放 -->
  <path d="M360 210V106" stroke="#315B43" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="380" cy="160" r="11" fill="#315B43"/><text x="380" y="164" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">5</text>
  <text x="396" y="164" font-size="12" fill="#315B43" font-weight="700">釋放</text>
  <use href="#v" x="360" y="64"/>

  <!-- ⊖ 擋在 ⑤ 釋放 -->
  <path d="M336 160H358" stroke="#D9897A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="180" y="114" width="156" height="104" rx="10" fill="#FDF1EE" stroke="#E7B3A6" stroke-width="1.5"/>
  <circle cx="198" cy="133" r="8" fill="#D9897A"/><path d="M193.5 133h9" stroke="#fff" stroke-width="2"/>
  <text x="212" y="137" font-size="11" fill="#C0624F" font-weight="700">治療 A、B 型流感</text>
  <text x="192" y="154" font-size="10" fill="#C0624F">Neuraminidase inhibitors</text>
  <text x="192" y="173" font-size="12" fill="#24372C" font-weight="700">Zanamivir</text>
  <text x="192" y="190" font-size="12" fill="#24372C" font-weight="700">Oseltamivir</text>
  <text x="192" y="207" font-size="12" fill="#24372C" font-weight="700">Peramivir</text>
</svg>
