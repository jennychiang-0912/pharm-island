<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, Heiti TC, sans-serif">
  <!-- 各類生物鹼：前驅物 → 中間產物（依生物鹼講義 p.2–4 印刷內容；拼字錯誤已訂正）
       對齊基準：小標欄 x=24（左對齊）；前驅物欄 x=150–374（置中 262）；箭頭 380–404；中間產物欄 x=410–546（置中 478）。
       每一列的文字都用 dominant-baseline="central" 對齊到同一條中線。 -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#315B43"/>
    </marker>
    <style>
      text { dominant-baseline: central; }
      .h { font-size: 13px; font-weight: 700; fill: #6E7F72; }
      .t { font-size: 17px; font-weight: 800; fill: #315B43; }
      .s { font-size: 12.5px; font-weight: 600; fill: #6E7F72; }
      .k { font-size: 13px; font-weight: 700; fill: #8A7550; }
      .p { font-size: 14px; font-weight: 700; fill: #24372C; text-anchor: middle; }
      .m { font-size: 14px; font-weight: 800; fill: #B4533F; text-anchor: middle; }
      .n { font-size: 12px; font-weight: 600; fill: #6E7F72; }
      .pill { fill: #EBE5CC; }
      .mid { fill: #FBE6E0; }
      .card { fill: #fff; stroke: #E3DDC2; stroke-width: 1.5; }
      .arw { stroke: #315B43; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="560" height="620" fill="#F7F5EC"/>
  <text class="h" x="24" y="24">類別</text>
  <text class="h" x="262" y="24" text-anchor="middle">★前驅物</text>
  <text class="h" x="478" y="24" text-anchor="middle">★中間產物</text>

  <!-- Pyridine-Piperidine -->
  <rect class="card" x="10" y="42" width="540" height="184" rx="14"/>
  <text class="t" x="24" y="68">Pyridine-Piperidine</text>
  <text class="s" x="24" y="92">Nicotine 生合成</text>
  <text class="k" x="24" y="128">Pyrrolidine</text>
  <rect class="pill" x="150" y="112" width="224" height="32" rx="16"/><text class="p" x="262" y="128">Ornithine</text>
  <path class="arw" d="M378 128H404" marker-end="url(#ar)"/>
  <rect class="mid" x="410" y="108" width="136" height="40" rx="14"/>
  <text class="m" x="478" y="120" font-size="12.5">N-Methyl-</text><text class="m" x="478" y="137" font-size="12.5">pyrrolinium ion</text>
  <text class="k" x="24" y="176">Pyridine</text>
  <rect class="pill" x="150" y="156" width="224" height="40" rx="16"/>
  <text class="p" x="262" y="168">Aspartic acid ＋</text><text class="p" x="262" y="185" font-size="12.5">Glyceraldehyde-3-phosphate</text>
  <path class="arw" d="M378 176H404" marker-end="url(#ar)"/>
  <rect class="mid" x="410" y="160" width="136" height="32" rx="16"/><text class="m" x="478" y="176">Nicotinic acid</text>
  <text class="n" x="478" y="208" text-anchor="middle">（中間經 Quinolinic acid）</text>

  <!-- Tropane -->
  <rect class="card" x="10" y="238" width="540" height="174" rx="14"/>
  <text class="t" x="24" y="264">★Tropane</text>
  <text class="s" x="24" y="288">Hyoscyamine 生合成</text>
  <text class="k" x="24" y="324">Pyrrolidine</text>
  <rect class="pill" x="150" y="308" width="224" height="32" rx="16"/><text class="p" x="262" y="324" font-size="12">Ornithine、Acetate、Methionine</text>
  <path class="arw" d="M378 324H404" marker-end="url(#ar)"/>
  <rect class="mid" x="410" y="308" width="136" height="32" rx="16"/><text class="m" x="478" y="324">Tropine</text>
  <text class="k" x="24" y="364">Pyridine</text>
  <rect class="pill" x="150" y="348" width="224" height="32" rx="16"/><text class="p" x="262" y="364">Phenylalanine</text>
  <path class="arw" d="M378 364H404" marker-end="url(#ar)"/>
  <rect class="mid" x="410" y="348" width="136" height="32" rx="16"/><text class="m" x="478" y="364">(-)-Tropic acid</text>
  <text class="n" x="24" y="400">[★國考] 生成物不具光學活性，互為 enantiomer</text>

  <!-- Quinoline -->
  <rect class="card" x="10" y="424" width="540" height="84" rx="14"/>
  <text class="t" x="24" y="454">Quinoline</text>
  <text class="s" x="24" y="478">Quinine 前驅物</text>
  <rect class="pill" x="150" y="450" width="224" height="32" rx="16"/><text class="p" x="262" y="466">Tryptophan ＋ Secologanin</text>

  <!-- Isoquinoline -->
  <rect class="card" x="10" y="520" width="540" height="84" rx="14"/>
  <text class="t" x="24" y="550">Isoquinoline</text>
  <text class="s" x="24" y="574">合成前驅物</text>
  <rect class="pill" x="150" y="546" width="224" height="32" rx="16"/><text class="p" x="262" y="562">Phenylalanine ＋ Tyrosine</text>
</svg>
