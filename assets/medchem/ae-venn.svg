<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" width="620" height="600" font-family="Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#2b2b2b">
  <!-- 講義 p.20 各類癲癇的用藥文氏圖（重畫） -->
  <text x="20" y="26" font-size="19" font-weight="700">局部性及強直-痙攣性發作(大發作)</text>
  <g transform="translate(0,30)">
    <circle cx="210" cy="200" r="185" fill="#E8C9A0" fill-opacity=".28" stroke="#2b2b2b" stroke-width="1.6"/>
    <circle cx="420" cy="190" r="160" fill="#A9C7E8" fill-opacity=".28" stroke="#2b2b2b" stroke-width="1.6"/>
    <circle cx="330" cy="370" r="165" fill="#B9DDB0" fill-opacity=".28" stroke="#2b2b2b" stroke-width="1.6"/>
    <g font-size="12" font-weight="700">
      <text x="70" y="62">PARTIAL AND</text><text x="70" y="77">GENERALIZED</text><text x="70" y="92">TONIC-CLONIC</text><text x="70" y="107">SEIZURES</text>
    </g>
    <g font-size="12.5">
      <text x="55" y="132">phenytoin, primidone,</text>
      <text x="55" y="149">carbamzepine, oxcarbazepine,</text>
      <text x="55" y="166">phenobarbital,</text>
      <text x="55" y="183">benzodiazepines,</text>
      <text x="55" y="200">ezogabine, lacosamide,</text>
      <text x="55" y="217">pregabalin, rufinamide,</text>
      <text x="55" y="234">tiagabine, topiramate,</text>
      <text x="55" y="251">vigabatrin</text>
    </g>
    <text x="470" y="140" font-size="18" font-weight="700" text-anchor="middle">肌攣性發作</text>
    <text x="470" y="160" font-size="12" font-weight="700" text-anchor="middle">MYOCLONIC SEIZURES</text>
    <text x="480" y="232" font-size="12.5" text-anchor="middle">topiramate</text>
    <text x="318" y="168" font-size="12.5" text-anchor="middle">felbamate</text>
    <g font-size="12.5" text-anchor="middle">
      <text x="330" y="232">lamotrigine</text><text x="330" y="249">levetiracetam</text><text x="330" y="266">valproate</text><text x="330" y="283">zonisamide</text>
    </g>
    <text x="225" y="335" font-size="12.5" text-anchor="middle">gabapentin</text>
    <text x="440" y="330" font-size="12.5" text-anchor="middle">clonazepam</text>
    <text x="330" y="425" font-size="18" font-weight="700" text-anchor="middle">失神性發作(小發作)</text>
    <text x="330" y="445" font-size="12" font-weight="700" text-anchor="middle">ABSENCE SEIZURES</text>
    <g font-size="12.5" text-anchor="middle"><text x="330" y="475">trimethadione, ethosuximide,</text><text x="330" y="492">methosuximide</text></g>
  </g>
</svg>
