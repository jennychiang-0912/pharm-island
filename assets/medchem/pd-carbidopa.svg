<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 584" width="520" height="584" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" fill="#2b2b2b">
  <!-- 講義 p.44 Levodopa 單用與併用 Carbidopa 的比較（重畫） -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <g fill="#fff" stroke="#2b2b2b" stroke-width="1.4">
    <rect x="10" y="44" width="130" height="96"/>
    <rect x="10" y="290" width="110" height="76"/>
    <rect x="370" y="262" width="130" height="38"/>
  </g>
  <g font-style="italic" text-anchor="middle">
    <text x="75" y="76">L-DOPA</text><text x="75" y="102">+</text><text x="75" y="128">Carbidopa</text>
    <text x="65" y="322">L-DOPA</text><text x="65" y="350">alone</text>
  </g>
  <text x="382" y="288">Carbidopa</text>

  <!-- 上：L-DOPA + Carbidopa -->
  <rect x="180" y="74" width="320" height="30" rx="8" fill="#e6e6e6" stroke="#2b2b2b" stroke-width="1.2"/>
  <rect x="216" y="58" width="18" height="62" fill="#777" stroke="#2b2b2b"/>
  <rect x="250" y="58" width="18" height="62" fill="#777" stroke="#2b2b2b"/>
  <line x1="242" y1="146" x2="242" y2="44" stroke="#555" stroke-width="9" marker-end="url(#a)"/>
  <text x="186" y="26">10% L-DOPA</text>
  <g font-size="17"><text x="420" y="66">Brain</text><text x="420" y="128">Blood</text></g>
  <text x="200" y="174">L-DOPA</text>
  <line x1="280" y1="168" x2="364" y2="168" stroke="#555" stroke-width="4" marker-end="url(#a)"/>
  <text x="372" y="174">Dopamine</text>
  <text x="420" y="200">90%</text>
  <g font-style="italic" font-size="16" text-anchor="middle"><text x="324" y="196">DOPA</text><text x="324" y="216">decarboxylase</text></g>
  <line x1="374" y1="258" x2="346" y2="228" stroke="#555" stroke-width="4" marker-end="url(#a)"/>
  <circle cx="384" cy="232" r="12" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="384" y="238" text-anchor="middle" font-weight="700" font-size="18">−</text>

  <!-- 下：L-DOPA alone -->
  <rect x="180" y="440" width="320" height="30" rx="8" fill="#e6e6e6" stroke="#2b2b2b" stroke-width="1.2"/>
  <rect x="216" y="424" width="18" height="62" fill="#777" stroke="#2b2b2b"/>
  <rect x="250" y="424" width="18" height="62" fill="#777" stroke="#2b2b2b"/>
  <line x1="242" y1="512" x2="242" y2="404" stroke="#555" stroke-width="4" marker-end="url(#a)"/>
  <text x="180" y="388">1-3% L-DOPA</text>
  <g font-size="17"><text x="420" y="432">Brain</text><text x="420" y="494">Blood</text></g>
  <text x="200" y="534">L-DOPA</text>
  <line x1="280" y1="528" x2="364" y2="528" stroke="#555" stroke-width="4" marker-end="url(#a)"/>
  <text x="372" y="534">Dopamine</text>
  <text x="404" y="558">97-99%</text>
  <g font-style="italic" font-size="16" text-anchor="middle"><text x="318" y="556">DOPA</text><text x="318" y="576">decarboxylase</text></g>
</svg>
